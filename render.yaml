services:
  - type: web
    name: repairmitra
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
    disk:
      name: repairmitra-db-disk
      mountPath: /opt/render/project/src/server
      sizeGB: 1
